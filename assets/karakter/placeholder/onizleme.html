<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yol Arkadaşı Yer Tutucular · Önizleme</title>
<style>
:root{color-scheme:light dark;--bg:#f3efe6;--fg:#26324d;--card:#fff;--mut:#6b7280}
@media (prefers-color-scheme:dark){:root{--bg:#121826;--fg:#e8ecf4;--card:#1b2236;--mut:#9aa4b8}}
body{margin:0;padding:24px;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 4px}p.s{margin:0 0 20px;color:var(--mut)}
h2{font-size:16px;margin:24px 0 8px}
.g{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
figure{margin:0;background:var(--card);border-radius:16px;padding:10px;text-align:center}
figure img{width:100%;height:auto;display:block}
figcaption{font-size:12px;color:var(--mut);margin-top:4px}
code{font-size:11px}
.sm{display:flex;gap:16px;align-items:flex-end;margin-top:12px}
.sm img{display:block}
@media (max-width:760px){.g{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<h1>Yol Arkadaşı: yer tutucu SVG'ler</h1>
<p class="s">3 tür x 5 evre. Geliştirici yer tutucusudur; nihai sanat illüstratör tarafından yapılacaktır. Küçük boyut testi için 48 px satırlarına bakın.</p>
<h2>Kıvılcım <span style="font-weight:400;color:var(--mut)">(Ateş yaratığı, <code>kivilcim</code>)</span></h2>
<div class="g">
<figure><img src="kivilcim-1.svg" alt="Kıvılcım evre 1"><figcaption>1 · Tohum/yumurta (sv 1)<br><code>kivilcim-1.svg</code></figcaption></figure>
<figure><img src="kivilcim-2.svg" alt="Kıvılcım evre 2"><figcaption>2 · Yavru (sv 5)<br><code>kivilcim-2.svg</code></figcaption></figure>
<figure><img src="kivilcim-3.svg" alt="Kıvılcım evre 3"><figcaption>3 · Genç (sv 12)<br><code>kivilcim-3.svg</code></figcaption></figure>
<figure><img src="kivilcim-4.svg" alt="Kıvılcım evre 4"><figcaption>4 · Usta (sv 25)<br><code>kivilcim-4.svg</code></figcaption></figure>
<figure><img src="kivilcim-5.svg" alt="Kıvılcım evre 5"><figcaption>5 · Efsane (sv 40)<br><code>kivilcim-5.svg</code></figcaption></figure>
</div>
<div class="sm"><img src="kivilcim-1.svg" width="48" height="48" alt=""><img src="kivilcim-2.svg" width="48" height="48" alt=""><img src="kivilcim-3.svg" width="48" height="48" alt=""><img src="kivilcim-4.svg" width="48" height="48" alt=""><img src="kivilcim-5.svg" width="48" height="48" alt=""><span style="color:var(--mut);font-size:12px">48 px</span></div>

</div>
<div class="sm"><img src="dinamo-1.svg" width="48" height="48" alt=""><img src="dinamo-2.svg" width="48" height="48" alt=""><img src="dinamo-3.svg" width="48" height="48" alt=""><img src="dinamo-4.svg" width="48" height="48" alt=""><img src="dinamo-5.svg" width="48" height="48" alt=""><span style="color:var(--mut);font-size:12px">48 px</span></div>

<figure><img src="sedir-1.svg" alt="Sedir evre 1"><figcaption>1 · Tohum/yumurta (sv 1)<br><code>sedir-1.svg</code></figcaption></figure>
<figure><img src="sedir-2.svg" alt="Sedir evre 2"><figcaption>2 · Yavru (sv 5)<br><code>sedir-2.svg</code></figcaption></figure>

</body></html>
