name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kopru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/kopru_test
    steps:
      - uses: actions/checkout@v4

      # pnpm surumu package.json "packageManager" alanindan okunur.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biçim
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tip kontrolü
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Servis OpenAPI anlikleri ve uretilen istemci tipleri guncel olmali.
      # Eskiyse: pnpm build && pnpm --filter @kopru/api-client generate
      - name: OpenAPI anlığı güncel mi
        run: pnpm --filter @kopru/api-client generate:check

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Mock API modu: gercek api servisi olmadan giris -> KVKK -> kurum secimi akisi calisir.
      - name: Web build (mock API)
        run: pnpm turbo run build --filter=@kopru/web
        env:
          NEXT_PUBLIC_API_MOCK: '1'

      - name: Playwright tarayıcısı
        run: pnpm --filter @kopru/web exec playwright install --with-deps chromium

      - name: Playwright e2e (masaüstü + mobil)
        run: pnpm --filter @kopru/web e2e
        env:
          E2E_HAZIR: '1'
          NEXT_PUBLIC_API_MOCK: '1'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-rapor
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
