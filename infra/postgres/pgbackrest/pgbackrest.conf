# pgBackRest ornek yapilandirmasi (ADR 0005 "PostgreSQL": surekli arsivleme + PITR, gunluk tam yedek, 14 gun).
# YER TUTUCULAR: <...> ile isaretli her sey saglayici secildikten sonra doldurulur. Gercek anahtar/adres
# bu dosyaya YAZILMAZ; sirlar ortamdan gelir (PGBACKREST_REPO1_S3_KEY / _KEY_SECRET / _CIPHER_PASS) ve
# sunucuda /etc/pgbackrest/pgbackrest.conf olarak 0640 postgres:postgres ile kurulur.
#
# Yer: ikinci Turkiye ici veri merkezindeki S3 uyumlu depo (birincil sunucudan FARKLI fiziksel konum).
# Veri Turkiye'de kalir (KVKK); sifreleme istemci tarafinda yapilir, depo saglayicisi acik veri gormez.

[global]
repo1-type=s3
repo1-s3-endpoint=<yedek-depo-s3-uc-noktasi>          # ornek: s3.<ikinci-veri-merkezi>.example
repo1-s3-region=<bolge>
repo1-s3-bucket=<kopru-pgbackrest>
repo1-path=/kopru-prod
repo1-s3-uri-style=path
# Anahtarlar ortam degiskeninden: PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET
repo1-cipher-type=aes-256-cbc
# Parola ortam degiskeninden: PGBACKREST_REPO1_CIPHER_PASS (kasada ayrica sakla; kaybi = yedekler okunamaz)

# Saklama: 14 gunluk tam yedek (gunluk tam => 14 kopya) ve bunlarin PITR icin WAL'i.
repo1-retention-full-type=count
repo1-retention-full=14
repo1-retention-archive-type=full
repo1-retention-archive=14

# Performans / dayaniklilik
process-max=2
compress-type=zst
compress-level=3
archive-async=y
spool-path=/var/spool/pgbackrest
start-fast=y
delta=y
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[kopru]
# Tek kume, 4 veritabani (api, motivasyon, bildirim, medya): hepsi birlikte yedeklenir/geri yuklenir.
pg1-path=/var/lib/postgresql/17/main
pg1-port=5432
pg1-user=postgres

# Yedekleme akis replikasindan alinabilir (birincil uzerindeki yuku azaltir):
# backup-standby=y
# pg2-host=<replika-adresi>
# pg2-path=/var/lib/postgresql/17/main
