# postgresql.conf (veya conf.d/arsiv.conf) icine eklenecek WAL arsivleme ayarlari.
# Degisiklik sonrasi `archive_mode` icin yeniden baslatma gerekir; ilk kurulumda bir kez.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=kopru archive-push %p'
archive_timeout = 60s          # trafik azken bile en cok 60 sn'lik veri kaybi (RPO ust siniri ~1 dk)
max_wal_senders = 5            # akis replikasi + pg_basebackup
wal_keep_size = 1GB
# Alarm: pg_stat_archiver.failed_count artiyorsa veya arsiv gecikiyorsa bkz. docs/isletim/el-kitabi.md
